<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>여행 대시보드</title>
<style>
  :root{--bg:#FAF6EF;--ink:#241F1A;--dim:#6F6659;--line:#EBE2D2;--coral:#E4624F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
  .wrap{width:100%;max-width:460px}
  h1{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 14px}
  a.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:18px;
         padding:18px 20px;box-shadow:0 1px 2px rgba(70,55,38,.05),0 12px 26px -18px rgba(70,55,38,.35)}
  a.card .k{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--coral)}
  a.card b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px}
  a.card i{font-style:normal;font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Travel dashboard</h1>
    <a class="card" href="./nhatrang-trip/">
      <span class="k">2027.02.12 – 02.18</span>
      <b>나트랑 5박 7일</b>
      <i>이상우 · 장경화 · 이시윤 가족 여행 — 일정 · 지도 · 먹거리 · 예산 · 준비</i>
    </a>
  </div>
</body>
</html>
